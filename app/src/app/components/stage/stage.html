<section class="flex min-h-0 flex-1 items-center justify-center bg-meet-stage px-6">
  @if (state() === 'waiting') {
    <p data-testid="waiting" class="text-center text-lg text-meet-muted">
      Aguardando o apresentador compartilhar a tela
    </p>
  } @else if (!stream()) {
    <p data-testid="connecting" class="text-center text-lg text-meet-muted">
      Conectando à tela…
    </p>
  } @else {
    <video
      #screen
      data-testid="shared-screen"
      class="max-h-full max-w-full object-contain"
      autoplay
      playsinline
      muted
    ></video>
  }
</section>
