<div class="flex min-h-dvh flex-col bg-meet-bg text-white">
  <app-stage class="flex min-h-0 flex-1" [state]="state()" [stream]="stream()" />
  <app-control-bar
    [participantCount]="participantCount()"
    [publicUrl]="publicUrl()"
    [canPresent]="canPresent"
    [sharing]="state() === 'sharing'"
    (copy)="copyLink()"
    (startShare)="startShare()"
    (stopShare)="stopShare()"
  />
</div>
